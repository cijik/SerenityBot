name: Maven Build and Release

on:
  pull_request:
  push:
    branches: ['master']

jobs:
  build-and-release:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
          settings-path: ${{ github.workspace }} # location for the settings.xml file

      - name: Compute release version
        run: |
          git fetch --tags --force

          latest_tag="$(git describe --tags --abbrev=0 2>/dev/null || true)"
          if [ -z "$latest_tag" ]; then
            latest_tag="$(mvn help:evaluate -Dexpression=revision -q -DforceStdout)"
            latest_tag="${latest_tag%-SNAPSHOT}"
          fi

          if ! printf '%s\n' "$latest_tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Expected a semantic version tag, got: $latest_tag" >&2
            exit 1
          fi

          IFS='.' read -r major minor patch <<EOF
          $latest_tag
          EOF

          commit_message="$(git log -1 --pretty=%B)"
          if printf '%s\n' "$commit_message" | grep -Eq '\b[A-Z][A-Z0-9]+-[0-9]+\b'; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          release_version="${major}.${minor}.${patch}"
          echo "RELEASE_VERSION=${release_version}" >> "$GITHUB_ENV"
          echo "revision=${release_version}" >> "$GITHUB_ENV"

      - name: Build with Maven
        run: mvn -B verify --file pom.xml -Drevision=${{ env.RELEASE_VERSION }}

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco
          if-no-files-found: error

      - name: Create Release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          release_name: v${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false

      - name: Upload binary to Release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: AButler/upload-release-assets@v3.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          files: target/serenity-bot-${{ env.RELEASE_VERSION }}.jar
          release-id: ${{ steps.create_release.outputs.id }}

  qodana:
    needs: build-and-release
    uses: ./.github/workflows/qodana_code_quality.yml
    with:
      checkout-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      coverage-artifact-name: coverage-report
